docs_dir: spec

# 推荐强度阈值（0-1）：澄清项 suggestion_confidence >= 该值时自动采纳推荐方案，不打断用户。
# 每个节点在下方 nodes.<id>.recommendation_threshold 单独配置；未配置时回退默认 0.8。
# 调低则更多项自动采纳、更少打断，调高则更多项需用户确认。

defaults:
  tool: claude_code
  model: ""

nodes:
  analyze_requirements:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  plan_session:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  design_test_cases:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  split_tasks:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  implement_code:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  verify_tests:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  ai_review:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
  commit_code:
    tool: claude_code
    model: ""
    recommendation_threshold: 0.8
