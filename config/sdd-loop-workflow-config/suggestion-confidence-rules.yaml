# =============================================================================
# SDD Loop Workflow — suggestion_confidence 打分机制（项目自定义扩展）
# =============================================================================
# 位置：业务项目根 / sdd-loop-workflow-config / suggestion-confidence-rules.yaml
# （由 sddl init 生成；已存在时 init 不会覆盖，项目自定义不会丢失）
#
# ---------- 作用 ----------
# 引擎已在 config/suggestion-confidence-rules.yaml 内置通用把握规则基线。
# 本文件的规则会**叠加**到引擎基线之上（引擎通用 + 项目扩展）。
#
# ---------- 用法（定性，无公式） ----------
# 规则只标方向，不给分值：
#   high_confidence_rules : 命中则「把握更高」的条件
#   low_confidence_rules  : 命中则「把握更低」的条件
# 每条规则：condition（触发条件，自然语言）/ reason（依据）
# AI 综合命中的高/低把握规则，自行给出 0-1 的 suggestion_confidence，并在
# suggestion_reason 注明命中的规则依据。无硬性公式，避免假精确。
#
# ---------- 合并策略 ----------
#   high_confidence_rules / low_confidence_rules 均叠加到引擎基线之后
#   留空或不配某节点 = 该节点仅用引擎通用规则
#
# ---------- 怎么扩展 ----------
# 在下方 nodes.<节点ID> 下添加项目专属规则。常用节点 ID：
#   analyze_requirements / plan_session / split_tasks
# 每条规则：condition（触发条件，自然语言）/ reason（依据）
#
# 示例（按需取消注释并改成你们项目的真实规则）：
#
# nodes:
#   analyze_requirements:
#     high_confidence_rules:
#       - condition: "需求来自已确认的 PRD 文档"
#         reason: "有 PRD 背书，推荐把握提升"
#     low_confidence_rules:
#       - condition: "涉及支付链路"
#         reason: "支付高风险，不宜高置信自决"
#   split_tasks:
#     low_confidence_rules:
#       - condition: "任务涉及核心交易模块"
#         reason: "核心模块改动需人工确认"
# =============================================================================

nodes: {}
