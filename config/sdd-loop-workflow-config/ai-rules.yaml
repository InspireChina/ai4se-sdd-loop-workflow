# =============================================================================
# SDD Loop Workflow — 项目扩展规则映射（核心扩展点）
# =============================================================================
# 位置：业务项目根 / sdd-loop-workflow-config / ai-rules.yaml
# （由 sddl init 生成；按项目修改。已存在时 init 不会覆盖。）
#
# ---------- 怎么扩展 ----------
# 规则正文不注入提示词。在 nodes.<节点ID> 下列出该节点要读的 md，路径相对 project_docs_dir：
#   common_extend_rules/<文件名>.md
#   repos/<仓库名>/extend_rules/<文件名>.md
# 计划写入 involved_repos 之后，仓库规则还要属于这份名单才进入该节点提示词。
# 没配在该节点上的文件不会出现。公共规则只看节点有没有配置。
# project_docs_dir 在 workflow-local.yaml，指向团队共享目录中的项目目录。
# 若某节点需要 MCP、IDE/Agent Rules、Skills：写在对应 md 里，不要在本 yaml 另配工具表。
#
# ---------- 节点与提交 ----------
# 常用节点 ID：analyze_requirements / plan_session / design_test_cases /
#   split_tasks / implement_code / verify_tests /
#   ai_review / commit_code
# commit_code：不配 = 人工询问是否提交、--auto 跳过；配上并在 md 写明策略则按 md 执行。
# 引擎硬约束：禁止把 spec 产出提交进业务仓库（与是否配置 commit_code 无关）。
# =============================================================================

# 示例：
# nodes:
#   plan_session:
#     - repos/<仓库名>/extend_rules/plan_guide.md
#   split_tasks:
#     - repos/<仓库名>/extend_rules/task_guide.md
nodes: {}
