# 引擎节点编排（tool / mode / prompt / inputs）。
# docs_dir 等业务运行时配置已迁到业务根：
#   <业务根>/sdd-loop-workflow-config/workflow.yaml
# 由 sddl init 生成。
#
# prompt      = 人工介入（需用户澄清 / review）
# prompt_auto = 无人值守（--auto）；Python 按 flag 二选一注入，勿在同一文件里写条件分支
#
# 兼容兜底（仅当业务侧尚未 init 时使用）：
workflow:
  docs_dir: spec
  app_root: ..

nodes:
  analyze_requirements:
    name: 需求分析与澄清
    tool: cursor
    mode: interactive
    prompt: prompts/01_requirements.md
    prompt_auto: prompts/01_requirements.auto.md
    output: 01-requirements.md
    inputs:
      - state: requirement
      - doc: 01-requirements.draft.md
      - doc: 01-requirements.md

  create_plan:
    name: 制定计划
    tool: cursor
    mode: headless
    prompt: prompts/02_create_plan.md
    prompt_auto: prompts/02_create_plan.auto.md
    output: 02-plan.md
    inputs:
      - doc: 01-requirements.md
      - state: requirement_type
      - state: requirement_summary
      - state: change_scope
      - state: affected_modules
      - state: compatibility_risk

  design_test_cases:
    name: 设计测试用例
    tool: cursor
    mode: headless
    prompt: prompts/02_design_test_cases.md
    prompt_auto: prompts/02_design_test_cases.auto.md
    output: 02-test-cases.md
    inputs:
      - doc: 01-requirements.md
      - state: requirement_type
      - state: requirement_summary
      - state: change_scope
      - state: affected_modules

  review_plan_and_tests:
    name: 计划与测试用例评审
    tool: cursor
    mode: interactive
    prompt: prompts/02_review_plan_and_tests.md
    prompt_auto: prompts/02_review_plan_and_tests.auto.md
    output: 02-plan-test-review.md
    inputs:
      - doc: 01-requirements.md
      - doc: 02-plan.md
      - doc: 02-test-cases.md
      - doc: 02-plan-test-review.draft.md
      - doc: 02-plan-test-review.md
      - state: requirement_type
      - state: requirement_summary
      - state: change_scope
      - state: affected_modules
      - state: compatibility_risk

  split_tasks:
    name: 任务拆分
    tool: cursor
    mode: interactive
    prompt: prompts/03_split_tasks.md
    prompt_auto: prompts/03_split_tasks.auto.md
    output: 03-tasks.md
    inputs:
      - doc: 01-requirements.md
      - doc: 02-plan.md
      - doc: 02-test-cases.md
      - doc: 02-plan-test-review.md
      - doc: 03-tasks.draft.md
      - doc: 03-tasks.md
      - state: requirement_type
      - state: change_scope
      - state: affected_modules

  implement_code:
    name: 代码实现
    tool: cursor
    mode: interactive
    prompt: prompts/04_implement_code.md
    prompt_auto: prompts/04_implement_code.auto.md
    output: 04-implementation.md
    inputs:
      - doc: 01-requirements.md
      - doc: 02-plan.md
      - doc: 02-test-cases.md
      - doc: 03-tasks.md
      - state: requirement_type
      - state: affected_modules
      - state: compatibility_risk

  verify_tests:
    name: 测试自验证
    tool: cursor
    mode: interactive
    prompt: prompts/05_verify_tests.md
    prompt_auto: prompts/05_verify_tests.auto.md
    output: 05-test-report.md
    inputs:
      - doc: 02-test-cases.md
      - doc: 03-tasks.md
      - doc: 04-implementation.md

  ai_review:
    name: AI 代码评审
    tool: cursor
    mode: interactive
    prompt: prompts/06_ai_review.md
    prompt_auto: prompts/06_ai_review.auto.md
    output: 06-ai-review.md
    inputs: []

  commit_code:
    name: 提交代码
    tool: cursor
    mode: interactive
    prompt: prompts/07_commit.md
    prompt_auto: prompts/07_commit.auto.md
    output: 07-commit.md
    inputs:
      - doc: 04-implementation.md
      - doc: 05-test-report.md
      - doc: 06-ai-review.md
