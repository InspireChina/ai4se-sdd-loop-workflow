# 引擎节点编排（tool / mode / prompt / inputs）。
# docs_dir、以及按项目覆盖的 tool/model 在业务根：
#   <业务根>/sdd-loop-workflow-config/workflow.yaml
# 由 sddl init 生成；业务侧 defaults / nodes.*.tool|model 会覆盖本文件。
#
# prompt      = 人工介入（需用户澄清 / review）
# prompt_auto = 无人值守（--auto）；Python 按 flag 二选一注入，勿在同一文件里写条件分支
#
# 兼容兜底（仅当业务侧尚未 init 时使用）：
workflow:
  docs_dir: spec
  app_root: ..

# 引擎级默认（可被业务 sdd-loop-workflow-config/workflow.yaml 覆盖）
defaults:
  tool: claude_code
  # model: ""

nodes:
  analyze_requirements:
    name: 需求分析与澄清
    tool: claude_code
    mode: interactive
    prompt: prompts/01_requirements.md
    prompt_auto: prompts/01_requirements.auto.md
    output: 01-requirements.md
    inputs:
      - state: requirement
      - doc: 01-requirements.md

  design_test_cases:
    name: 设计测试用例
    tool: claude_code
    mode: headless
    prompt: prompts/02_design_test_cases.md
    prompt_auto: prompts/02_design_test_cases.auto.md
    output: 02-test-cases.md
    inputs:
      - doc: 01-requirements.md
      - state: requirement_type
      - state: requirement_summary
      - state: change_scope
      - state: affected_modules

  # 一次交互会话：只写 02-plan.md，并在同一份里完成澄清和确认。
  # 用例由主会话按工具拉起后台 subagent 写。design_test_cases 只提供用例 prompt，不单独跑。
  plan_session:
    name: 计划与澄清
    tool: claude_code
    mode: interactive
    prompt: prompts/02_plan_session.md
    prompt_auto: prompts/02_plan_session.auto.md
    output: 02-plan.md
    inputs:
      - doc: 01-requirements.md
      - doc: 02-plan.md
      - state: requirement_type
      - state: requirement_summary
      - state: change_scope
      - state: affected_modules
      - state: compatibility_risk

  split_tasks:
    name: 任务拆分
    tool: claude_code
    mode: interactive
    prompt: prompts/03_split_tasks.md
    prompt_auto: prompts/03_split_tasks.auto.md
    output: 03-tasks.md
    inputs:
      - doc: 01-requirements.md
      - doc: 02-plan.md
      - doc: 03-tasks.md
      - state: requirement_type
      - state: change_scope
      - state: affected_modules

  implement_code:
    name: 代码实现
    tool: claude_code
    mode: interactive
    prompt: prompts/04_implement_code.md
    prompt_auto: prompts/04_implement_code.auto.md
    output: 04-implementation.md
    inputs:
      - doc: 01-requirements.md
      - doc: 02-plan.md
      - doc: 02-test-cases.md
      - doc: 03-tasks.md
      - state: requirement_type
      - state: affected_modules
      - state: compatibility_risk

  verify_tests:
    name: 测试自验证
    tool: claude_code
    mode: interactive
    prompt: prompts/05_verify_tests.md
    prompt_auto: prompts/05_verify_tests.auto.md
    output: 05-test-report.md
    inputs:
      - doc: 02-test-cases.md
      - doc: 03-tasks.md
      - doc: 04-implementation.md

  ai_review:
    name: AI 代码评审
    tool: claude_code
    mode: interactive
    prompt: prompts/06_ai_review.md
    prompt_auto: prompts/06_ai_review.auto.md
    output: 06-ai-review.md
    inputs: []

  commit_code:
    name: 提交代码
    tool: claude_code
    mode: interactive
    prompt: prompts/07_commit.md
    prompt_auto: prompts/07_commit.auto.md
    output: 07-commit.md
    inputs:
      - doc: 04-implementation.md
      - doc: 05-test-report.md
      - doc: 06-ai-review.md
